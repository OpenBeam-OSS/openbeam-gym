[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openbeam-gym"
version = "0.1.0"
description = "Gymnasium environments for robot learning on OpenBeam's soft-body simulation, over MCP"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "OpenBeam, LLC" }]
keywords = ["gymnasium", "reinforcement-learning", "robotics", "simulation", "mcp", "openbeam", "so-101"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["gymnasium>=1.0", "numpy>=1.24"]

[project.optional-dependencies]
image = ["pillow>=10"]
train = ["stable-baselines3>=2.3", "torch>=2.2"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/OpenBeam-OSS/openbeam-gym"
Repository = "https://github.com/OpenBeam-OSS/openbeam-gym"
Issues = "https://github.com/OpenBeam-OSS/openbeam-gym/issues"

[tool.setuptools.packages.find]
include = ["openbeam_gym*"]

[tool.setuptools.package-data]
openbeam_gym = ["robots/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
